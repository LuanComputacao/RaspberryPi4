name: caddy

services:
  caddy:
    image: caddy:2.10-alpine
    container_name: caddy
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      # LAN + Tailscale (IP da placa). Beszel :8090 continua só em 127.0.0.1.
      - "80:80"
      - "3000:3000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    networks:
      - edge
    mem_limit: 64m
    cpus: 0.50
    labels:
      - wud.watch=true
      - wud.tag.include=^2(\.\d+)+-alpine$$

networks:
  edge:
    external: true
