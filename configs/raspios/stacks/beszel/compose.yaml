name: beszel

services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      APP_URL: ${APP_URL:-http://192.168.1.100/beszel}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket
    networks:
      - edge
    mem_limit: 128m
    cpus: 0.50
    labels:
      - wud.watch=true

  # Sobe depois do 1º login: preencher BESZEL_KEY e BESZEL_TOKEN no .env
  # e `docker compose --profile agent up -d`.
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    profiles: ["agent"]
    network_mode: host
    volumes:
      - ./beszel_agent_data:/var/lib/beszel-agent
      - ./beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://127.0.0.1:8090
      TOKEN: ${BESZEL_TOKEN}
      KEY: ${BESZEL_KEY}
    mem_limit: 64m
    cpus: 0.25
    labels:
      - wud.watch=true

networks:
  edge:
    external: true
